<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id = "mainFrame">

        <div id = "buttons">
            <button id = "rockButton" ><span id = "emoji">🪨</span></button>
            <button id = "paperButton" ><span id = "emoji">📄</span></button>
            <button id = "scissorButton" ><span id = "emoji">✂️</span></button>
        </div>

        <div id = "choice">
            <div id = "humanChoice">
                <div id = "humanChoiceMessage">YOU</div>
                <div id = "humanChoiceEmoji">🪨</div>
            </div>
            <div id = "computerChoice">
                <div id = "computerChoiceMessage">BOT</div>
                <div id = "computerChoiceEmoji"><span id = "emoji">✂️</span></div>
            </div>  
        </div>

        <button id = "winningMessage">PLAY</button>

        <div id = "score">
            <p id= "computerScore">COMPUTER : <span id="botScore">0</span></p>
            <p id= "humanScore">YOU : <span id="userScore">0</span></p>
        </div>

    </div>

    <script  src = "code.js"></script>  
</body>
</html>
